name: hangout
description: "Hang Out — a social network that facilitates socialising activities."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Localization: load text from JSON asset files
  intl: ^0.20.2

  # UUIDs for mock data / client-side ids
  uuid: ^4.5.1

  # Caching network images on the activity cards
  cached_network_image: ^3.4.1

  # Date formatting helpers for activity start times
  timeago: ^3.7.0
  file_picker: ^11.0.2
  desktop_drop: ^0.7.1
  google_fonts: ^8.1.0

  # Firebase backend (project: hang-out-129b5). Used when AppConfig.useMockBackend
  # is false; the app still runs fully on mock repositories when it's true.
  # (messaging/storage/analytics added in later passes.)
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  google_sign_in: ^7.2.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Localization & other bundled assets
  assets:
    - assets/i18n/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/logo/app_icon_background.png"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/logo/app_icon.png"
